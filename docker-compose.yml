version: "3.8"

services:
  medisearch-mcp:
    image: python:3.11-slim
    container_name: medisearch-mcp
    working_dir: /app
    volumes:
      - ./medisearch/mcp-server:/app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
