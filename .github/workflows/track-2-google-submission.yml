name: Deploy MediRAG to Google Cloud (Track 2)

on:
  push:
    branches: [track-2-mcp-submission]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: project-5f9ff1f2-755e-4532-bcd
  GCP_REGION: us-central1
  MCP_IMAGE: gcr.io/project-5f9ff1f2-755e-4532-bcd/verirag-mcp
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # opt in before June 2026 forced migration

jobs:
  # ── Job 1: MCP Server (FastAPI + FastMCP) ─────────────────────────────────
  deploy-mcp-server:
    name: Deploy MCP Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      mcp_url: ${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Build MCP image with Cloud Build
        working-directory: ./apps/backend
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions="_IMAGE=${{ env.MCP_IMAGE }}:${{ github.sha }}" \
            .

      - name: Deploy MCP Server to Cloud Run
        run: |
          gcloud run deploy verirag-mcp-server \
            --image="${{ env.MCP_IMAGE }}:${{ github.sha }}" \
            --region="${{ env.GCP_REGION }}" \
            --allow-unauthenticated \
            --port=8000 \
            --cpu=4 \
            --memory=8Gi \
            --no-cpu-throttling \
            --min-instances=1 \
            --cpu-boost

      - name: Get MCP Server URL
        id: get-url
        run: |
          URL=$(gcloud run services describe verirag-mcp-server \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "MCP Server deployed at: $URL"

  # ── Job 2: ADK Agent ──────────────────────────────────────────────────────
  deploy-adk-agent:
    name: Deploy ADK Agent
    runs-on: ubuntu-latest
    needs: deploy-mcp-server
    permissions:
      contents: read
      id-token: write
    outputs:
      agent_url: ${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install ADK
        run: pip install google-adk>=1.0.0

      - name: Deploy ADK agent
        working-directory: ./verirag-adk-agent
        env:
          MCP_SERVER_URL: ${{ needs.deploy-mcp-server.outputs.mcp_url }}/mcp
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GCP_REGION }}
        run: |
          adk deploy cloud_run medirag_agent \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --with_ui \
            --app_name=medirag-agent \
            --set-env-vars="MCP_SERVER_URL=${MCP_SERVER_URL}" \
            --set-secrets="GOOGLE_API_KEY=google-api-key:latest" \
            -- \
            --allow-unauthenticated \
            --cpu=2 \
            --memory=2Gi \
            --min-instances=0 \
            --max-instances=10

      - name: Get ADK Agent URL
        id: get-url
        run: |
          URL=$(gcloud run services describe medirag-agent \
            --region="${{ env.GCP_REGION }}" \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "ADK Agent deployed at: $URL"

  # ── Job 3: React Frontend (Nginx) ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy React Frontend
    runs-on: ubuntu-latest
    needs: deploy-adk-agent
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: 'access_token'

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: verirag-frontend
          source: ./apps/frontend
          region: ${{ env.GCP_REGION }}
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
          env_vars: |
            VITE_API_URL=${{ needs.deploy-adk-agent.outputs.agent_url }}
