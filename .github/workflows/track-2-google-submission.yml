name: Deploy MediRAG to Google Cloud (Track 2)

on:
  push:
    branches: [track-2-mcp-submission]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: project-5f9ff1f2-755e-4532-bcd
  GCP_REGION: us-central1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Opt in before June 2026 forced migration

jobs:
  # ── Job 1: MCP Server (Django + FastAPI + FastMCP) ─────────────────────────
  deploy-mcp-server:
    name: Deploy MCP Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      mcp_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: verirag-mcp-server
          source: ./apps/backend
          region: ${{ env.GCP_REGION }}
          flags: >-
            --dockerfile=Dockerfile.mcp
            --allow-unauthenticated
            --port=8000
            --cpu=4
            --memory=8Gi
            --no-cpu-throttling
            --min-instances=1
            --cpu-boost

  # ── Job 2: ADK Agent ──────────────────────────────────────────────────────
  # Deploys using `adk deploy cloud_run` — the canonical codelab pattern.
  # --with_ui serves the ADK developer UI at the Cloud Run URL so judges
  # can interact with the agent directly in their browser.
  deploy-adk-agent:
    name: Deploy ADK Agent
    runs-on: ubuntu-latest
    needs: deploy-mcp-server
    permissions:
      contents: read
      id-token: write
    outputs:
      agent_url: ${{ steps.get-url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Install ADK
        run: pip install google-adk>=1.0.0

      - name: Deploy ADK agent with adk deploy cloud_run
        working-directory: ./verirag-adk-agent
        env:
          MCP_SERVER_URL: ${{ needs.deploy-mcp-server.outputs.mcp_url }}/mcp
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ env.GCP_PROJECT_ID }}
          GOOGLE_CLOUD_LOCATION: ${{ env.GCP_REGION }}
        run: |
          adk deploy cloud_run medirag_agent \
            --project=${{ env.GCP_PROJECT_ID }} \
            --region=${{ env.GCP_REGION }} \
            --with_ui \
            --app_name=medirag-agent \
            --set-env-vars="MCP_SERVER_URL=${MCP_SERVER_URL}" \
            --set-secrets="GOOGLE_API_KEY=google-api-key:latest" \
            -- \
            --allow-unauthenticated \
            --cpu=2 \
            --memory=2Gi \
            --min-instances=0 \
            --max-instances=10

      - name: Get deployed service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe medirag-agent \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "ADK Agent deployed at: $URL"

  # ── Job 3: React Frontend (Nginx) ─────────────────────────────────────────
  deploy-frontend:
    name: Deploy React Frontend
    runs-on: ubuntu-latest
    needs: deploy-adk-agent
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: verirag-frontend
          source: ./apps/frontend
          region: ${{ env.GCP_REGION }}
          # --port=8080 matches nginx listen 8080 in apps/frontend/Dockerfile
          flags: >-
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
          env_vars: |
            VITE_API_URL=${{ needs.deploy-adk-agent.outputs.agent_url }}
