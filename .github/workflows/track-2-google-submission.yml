name: Deploy VeriRAG to Google Cloud (Track 2)

on:
  push:
    branches: [track-2-mcp-submission]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: project-5f9ff1f2-755e-4532-bcd
  GCP_REGION: us-central1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # FIX: Node 20 deprecation (enforced June 2026)

jobs:
  deploy-mcp-server:
    name: Deploy MCP Server
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      mcp_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: verirag-mcp-server
          source: ./apps/backend
          region: ${{ env.GCP_REGION }}
          # FIX 1: Explicit Dockerfile.mcp so Cloud Build starts Uvicorn, not Gunicorn
          # FIX 2: cpu-boost + no-cpu-throttling prevents gRPC cold-start hangs
          # FIX 3: min-instances=1 ensures no cold starts for a clinical/healthcare app
          flags: >-
            --dockerfile=Dockerfile.mcp
            --allow-unauthenticated
            --port=8000
            --cpu=4
            --memory=8Gi
            --no-cpu-throttling
            --min-instances=1
            --cpu-boost

  deploy-adk-agent:
    name: Deploy ADK Agent
    runs-on: ubuntu-latest
    needs: deploy-mcp-server
    permissions:
      contents: read
      id-token: write
    outputs:
      agent_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: verirag-adk-agent
          source: ./verirag-adk-agent
          region: ${{ env.GCP_REGION }}
          flags: "--allow-unauthenticated --port=8080"
          env_vars: |
            MCP_SERVER_URL=${{ needs.deploy-mcp-server.outputs.mcp_url }}

  deploy-frontend:
    name: Deploy React Frontend
    runs-on: ubuntu-latest
    needs: deploy-adk-agent
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: verirag-frontend
          source: ./apps/frontend
          region: ${{ env.GCP_REGION }}
          flags: "--allow-unauthenticated --port=80"
          env_vars: |
            VITE_API_URL=${{ needs.deploy-adk-agent.outputs.agent_url }}