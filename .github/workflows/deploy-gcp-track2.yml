name: Deploy VeriRAG Full-Stack to Google Cloud (Track 2)

on:
  push:
    branches: [track-2-mcp-submission]
  workflow_dispatch:

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: us-central1

jobs:
  setup:
    name: Setup and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.GCP_PROJECT_ID }}" ] || [ -z "${{ secrets.GOOGLE_CLOUD_SA_JSON }}" ]; then
            echo "❌ Missing mandatory GCP secrets!"
            exit 1
          fi
          echo "✅ GCP secrets validated."

  deploy-mcp-server:
    name: Deploy MCP Server (Backend)
    runs-on: ubuntu-latest
    needs: setup
    outputs:
      mcp_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_SA_JSON }}
      - uses: google-github-actions/setup-gcloud@v1
      
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy verirag-mcp-server \
            --source ./apps/backend \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --memory 2Gi \
            --port 8000 \
            --format 'value(status.address.url)' > mcp_url.txt
          echo "url=$(cat mcp_url.txt)" >> $GITHUB_OUTPUT

  deploy-adk-agent:
    name: Deploy Gemini ADK Agent
    runs-on: ubuntu-latest
    needs: deploy-mcp-server
    outputs:
      agent_url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_SA_JSON }}
      - uses: google-github-actions/setup-gcloud@v1
      
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy verirag-adk-agent \
            --source ./verirag-adk-agent \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars MCP_SERVER_URL=${{ needs.deploy-mcp-server.outputs.mcp_url }} \
            --port 8080 \
            --format 'value(status.address.url)' > agent_url.txt
          echo "url=$(cat agent_url.txt)" >> $GITHUB_OUTPUT

  deploy-frontend:
    name: Deploy React Frontend
    runs-on: ubuntu-latest
    needs: deploy-adk-agent
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_SA_JSON }}
      - uses: google-github-actions/setup-gcloud@v1
      
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy verirag-frontend \
            --source ./apps/frontend \
            --region ${{ env.GCP_REGION }} \
            --allow-unauthenticated \
            --set-env-vars VITE_API_URL=${{ needs.deploy-adk-agent.outputs.agent_url }} \
            --port 80
          echo "✅ Frontend is live!"

  post-deployment:
    name: Final Verification
    runs-on: ubuntu-latest
    needs: [deploy-mcp-server, deploy-adk-agent]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "=========================================="
          echo "🎯 VeriRAG Track 2 Submission Live!"
          echo "=========================================="
          echo "Backend (MCP): ${{ needs.deploy-mcp-server.outputs.mcp_url }}"
          echo "Agent (ADK):   ${{ needs.deploy-adk-agent.outputs.agent_url }}"
          echo "Frontend UI:   (Check Cloud Run Console)"
          echo "=========================================="